services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/backend/laravel
    volumes:
      - ./backend/laravel:/var/www/backend/laravel/
      - ./frontend/vue:/var/www/frontend/vue/
      - .:/var/www/html
    environment:
      XDEBUG_MODE: "off"
      PHP_OPCACHE_ENABLE: 1
    depends_on:
      - db
    networks: [app]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./backend/laravel:/var/www/backend/laravel/
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/admin.conf:/etc/nginx/conf.d/admin.conf
    depends_on:
      - php
    networks: [app]

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/backend/laravel
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8090:8080"
    environment:
      - APP_ENV=local
    volumes:
      - .:/var/www/html
      - ./backend/laravel:/var/www/backend/laravel/
    depends_on:
      - db
    networks: [app]

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/backend/laravel
    command: php artisan queue:work --tries=3
    volumes:
      - .:/var/www/html
      - ./backend/laravel:/var/www/backend/laravel/
    depends_on:
      - db
      - php
    networks: [app]
    restart: always

  phpmyadmin:
    image: phpmyadmin
    container_name: pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks: [app]

  db:
    image: mysql:8.0
    container_name: mysql_corp
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [app]

networks:
  app:
    driver: bridge
volumes:
  mysql-data: